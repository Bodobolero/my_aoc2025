[package]
name = "my_aoc2025"
version = "0.1.0"
edition = "2024"

[dependencies]
intervaltree = "0.2.7"
itertools = "0.14.0"
lazy-regex = "3.4.2"
lazy_static = "1.5.0"
ordered-float = "5.1.0"
regex = "1.12.2"
rustc-hash = "2.1.1"


[dev-dependencies]
criterion = "0.7.0"


[[bin]]
name = "day01"
path = "src/bin/day01.rs"

[[bin]]
name = "day02"
path = "src/bin/day02.rs"

[[bin]]
name = "day03"
path = "src/bin/day03.rs"

[[bin]]
name = "day04"
path = "src/bin/day04.rs"

[[bin]]
name = "day05"
path = "src/bin/day05.rs"

[profile.dev]
opt-level = 1

[profile.bench]
opt-level = 3


[[bench]]
name = "benchmark"
harness = false
